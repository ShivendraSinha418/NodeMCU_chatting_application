<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IoT Chat App</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#0b141a;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .chat-container{
      width:100%;
      max-width:430px;
      height:95vh;
      background:#111b21;
      display:flex;
      flex-direction:column;
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 0 30px rgba(0,0,0,0.5);
    }

    /* HEADER */

    .chat-header{
      background:#202c33;
      padding:15px;
      display:flex;
      align-items:top;
      gap: 12px;
      border-bottom:1px solid #2a3942;
    }

    .avatar{
      width:45px;
      height:45px;
      border-radius:50%;
      background:#25d366;
      display:flex;
      justify-content:center;
      align-items:center;
      color:white;
      font-size:20px;
      font-weight:bold;
    }

    .header-text h2{
      color:white;
      font-size:18px;
    }

    .header-text p{
      color:#9aa6ad;
      font-size:12px;
    }

    /* CHAT AREA */

    .chat-box{
      flex:1;
      overflow-y:auto;
      padding:20px;
      display:flex;
      flex-direction:column;
      gap:10px;

      background-image:
      radial-gradient(#1f2c34 1px, transparent 1px);

      background-size:20px 20px;
    }

    .message{
      max-width:80%;
      padding:10px 14px;
      border-radius:12px;
      color:white;
      position:relative;
      word-wrap:break-word;
      animation:fadeIn 0.3s ease;
    }

    .received{
      background:#202c33;
      align-self:flex-start;
      border-top-left-radius:4px;
    }

    .sent{
      background:#005c4b;
      align-self:flex-end;
      border-top-right-radius:4px;
    }

    .msg-time{
      font-size:10px;
      color:#cbd5e1;
      text-align:right;
      margin-top:5px;
    }

    /* INPUT AREA */

    .input-area{
      background:#202c33;
      padding:12px;
      display:flex;
      gap:10px;
      align-items:center;
    }

    .input-area input{
      flex:1;
      padding:12px;
      border:none;
      outline:none;
      border-radius:25px;
      background:#2a3942;
      color:white;
      font-size:15px;
    }

    .input-area button{
      width:50px;
      height:50px;
      border:none;
      border-radius:50%;
      background:#25d366;
      color:white;
      font-size:20px;
      cursor:pointer;
      transition:0.3s;
    }

    .input-area button:hover{
      transform:scale(1.08);
    }

    .status{
      text-align:center;
      padding:5px;
      color:#9aa6ad;
      font-size:12px;
      background:#111b21;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(10px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }
/* ----------------------------- */
/* MOBILE RESPONSIVE DESIGN */
/* ----------------------------- */

@media screen and (max-width: 768px){

  body{
    padding:0;
    overflow:hidden;
  }

  .chat-container{

    width:100%;
    height:100vh;

    max-width:100%;
    border-radius:0;

  }

  .chat-header{

    padding:12px;

  }

  .avatar{

    width:40px;
    height:40px;

    font-size:18px;

  }

  .header-text h2{

    font-size:16px;

  }

  .header-text p{

    font-size:11px;

  }

  .chat-box{

    padding:12px;
    gap:8px;

  }

  .message{

    max-width:88%;

    padding:10px 12px;

    font-size:14px;

    line-height:1.4;

  }

  .msg-time{

    font-size:9px;

  }

  .input-area{

    padding:10px;
    gap:8px;

  }

  .input-area input{

    padding:12px;

    font-size:15px;

    border-radius:22px;

  }

  .input-area button{

    width:46px;
    height:46px;

    font-size:18px;

    flex-shrink:0;

  }

  .status{

    font-size:11px;
    padding:4px;

  }

}

/* EXTRA SMALL DEVICES */

@media screen and (max-width: 480px){

  .message{

    max-width:92%;

    font-size:13px;

  }

  .input-area input{

    font-size:14px;

  }

}
  </style>
</head>

<body>

<div class="chat-container">

  <!-- HEADER -->

  <div class="chat-header">

    <div class="avatar">
      S
    </div>

    <div class="header-text">
      <h2>Chat with Node</h2>
      <p>Connected</p>
    </div>

  </div>

  <!-- CHAT BOX -->

  <div class="chat-box" id="chatBox">
  </div>

  <!-- STATUS -->

  <div class="status" id="status">
    Connecting...
  </div>

  <!-- INPUT -->

  <div class="input-area">

    <input
      type="text"
      id="messageInput"
      placeholder="Type a message"
    >

    <button onclick="sendMessage()">
      ➤
    </button>

  </div>

</div>

<script>

  // -----------------------------
  // THINGSPEAK CONFIG
  // -----------------------------

  const CHANNEL_ID = "3386356";

  const READ_API =
  "ZSVHBEAI3S81U45T";

  const WRITE_API =
  "2ODJSP9MYAYB1R1H";

  const READ_URL =
  `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?api_key=${READ_API}&results=20`;

  // -----------------------------
  // FETCH ALL MESSAGES
  // -----------------------------

  async function fetchMessages(){

    try{

      const response = await fetch(READ_URL);

      const data = await response.json();

      const feeds = data.feeds;

      const chatBox =
      document.getElementById("chatBox");

      chatBox.innerHTML = "";

      feeds.forEach(feed => {

        if(feed.field1){

          const msgDiv =
          document.createElement("div");

          msgDiv.classList.add("message");

          // Alternate sent & received style
          if(feed.entry_id % 2 == 0){

            msgDiv.classList.add("sent");

          }
          else{

            msgDiv.classList.add("received");
          }

          msgDiv.innerHTML = `
            <div>${feed.field1}</div>

            <div class="msg-time">
              ${new Date(feed.created_at)
              .toLocaleTimeString()}
            </div>
          `;

          chatBox.appendChild(msgDiv);

        }

      });

      // Auto scroll to latest message

      chatBox.scrollTop =
      chatBox.scrollHeight;

      document.getElementById("status")
      .innerText = "Online";

    }
    catch(error){

      document.getElementById("status")
      .innerText = "Connection Error";

      console.log(error);
    }

  }

  // -----------------------------
  // SEND MESSAGE
  // -----------------------------

  async function sendMessage(){

    const input =
    document.getElementById("messageInput");

    const message =
    input.value.trim();

    if(message === "") return;

    document.getElementById("status")
    .innerText = "Sending...";

    try{

      const url =
      `https://api.thingspeak.com/update?api_key=${WRITE_API}&field1=${encodeURIComponent(message)}`;

      await fetch(url, {
        method:"GET",
        mode:"no-cors"
      });

      input.value = "";

      document.getElementById("status")
      .innerText = "Message Sent";

      setTimeout(fetchMessages,2000);

    }
    catch(error){

      document.getElementById("status")
      .innerText = "Failed To Send";

      console.log(error);
    }

  }

  // -----------------------------
  // ENTER KEY SUPPORT
  // -----------------------------

  document
  .getElementById("messageInput")
  .addEventListener("keypress", function(e){

    if(e.key === "Enter"){

      sendMessage();
    }

  });

  // -----------------------------
  // AUTO REFRESH
  // -----------------------------

  fetchMessages();

  setInterval(fetchMessages,5000);

</script>

</body>
</html>
